name: Unpack redesigned source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/unpack.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decode and extract source
        shell: bash
        run: |
          set -euo pipefail
          cat archive.part-* > project.tar.gz.b64
          base64 --decode project.tar.gz.b64 > project.tar.gz
          tar -xzf project.tar.gz
          rm -f archive.part-* project.tar.gz.b64 project.tar.gz

      - name: Commit redesigned website
        shell: bash
        run: |
          git config user.name "DiTz Store Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: add premium DiTz Store module hub"
          git push
